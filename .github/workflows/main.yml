name: Deploy Credimax EC2

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: read-all

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ec2-34-237-18-97.compute-1.amazonaws.com
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22

          script: |
            bash -lc '/proyecto/Credimas/deploy.sh'
