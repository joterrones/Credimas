services:
  db:
    image: postgres:16-alpine
    container_name: credimax-db
    environment:
      POSTGRES_USER: credimax
      POSTGRES_PASSWORD: credimax
      POSTGRES_DB: credimax
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credimax -d credimax"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
